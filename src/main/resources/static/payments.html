<!-- Payment Modal -->
<div id="paymentModal" class="modal hidden">
    <div class="modal-content">

        <div class="modal-header">
            <h3>Record Payment</h3>
            <span class="close-btn" id="closeModal">&times;</span>
        </div>

        <form id="paymentForm">

            <div class="form-group">
                <label for="paymentStudentId">
                    Student
                </label>

                <select
                        id="paymentStudentId"
                        class="form-control"
                        required>

                    <option value="">
                        Select a student
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label for="paymentAmount">
                    Amount (₹)
                </label>

                <input
                        type="number"
                        step="0.01"
                        min="0.01"
                        id="paymentAmount"
                        class="form-control"
                        required>
            </div>

            <div class="form-group">
                <label for="paymentMethod">
                    Payment Method
                </label>

                <select
                        id="paymentMethod"
                        class="form-control"
                        required>

                    <option value="CASH">CASH</option>
                    <option value="UPI">UPI</option>
                    <option value="CARD">CARD</option>
                    <option value="BANK_TRANSFER">
                        BANK TRANSFER
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label for="paymentStatus">
                    Payment Status
                </label>

                <select
                        id="paymentStatus"
                        class="form-control"
                        required>

                    <option value="PAID">PAID</option>
<!--                    <option value="PENDING">PENDING</option>-->

                </select>
            </div>

            <div class="form-actions">

                <button
                        type="button"
                        class="btn btn-secondary"
                        id="cancelBtn">
                    Cancel
                </button>

                <button
                        type="submit"
                        class="btn btn-primary">
                    Submit Payment
                </button>

            </div>

        </form>
    </div>
</div>
<script src="js/api.js"></script><script src="js/common.js"></script><script src="js/payments.js"></script></body></html>
