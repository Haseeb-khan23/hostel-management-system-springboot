<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Payments | Hostel Management System</title><link rel="stylesheet" href="css/main.css"></head>
<body><div class="app-layout"><aside class="sidebar" id="sidebar"></aside><main class="main-content"><header class="top-header"><div><h2>Payments</h2><p>Record and manage payment records</p></div><button id="addPaymentBtn" class="btn btn-primary">Record Payment</button></header><div id="alertBox" class="alert hidden"></div><div class="card"><table class="data-table"><thead><tr><th>ID</th><th>Student</th><th>Amount</th><th>Method</th><th>Status</th><th>Payment Date</th><th>Actions</th></tr></thead><tbody id="paymentsTableBody"><tr><td colspan="7" class="text-center">Loading...</td></tr></tbody></table></div></main></div>
<div id="paymentModal" class="modal hidden"><div class="modal-content"><div class="modal-header"><h3 id="modalTitle">Record Payment</h3><span id="closeModal" class="close-btn">&times;</span></div><form id="paymentForm"><input id="paymentId" type="hidden"><div class="form-group"><label>Student ID</label><input id="paymentStudentId" class="form-control" type="number" min="1" required></div><div class="form-group"><label>Amount (₹)</label><input id="paymentAmount" class="form-control" type="number" min="0.01" step="0.01" required></div><div class="form-group"><label>Payment Method</label><select id="paymentMethod" class="form-control" required><option value="CASH">CASH</option><option value="UPI">UPI</option><option value="CARD">CARD</option><option value="BANK_TRANSFER">BANK_TRANSFER</option></select></div><div class="form-group"><label>Status</label><select id="paymentStatus" class="form-control" required><option value="PENDING">PENDING</option><option value="PAID">PAID</option></select></div><div class="form-actions"><button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div>
<script src="js/api.js"></script><script src="js/common.js"></script><script src="js/payments.js"></script></body></html>
