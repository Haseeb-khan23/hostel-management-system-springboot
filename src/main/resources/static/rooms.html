<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rooms | Hostel Management System</title><link rel="stylesheet" href="css/main.css"></head>
<body><div class="app-layout"><aside class="sidebar" id="sidebar"></aside><main class="main-content"><header class="top-header"><div><h2>Rooms</h2><p>Manage hostel rooms</p></div><button id="addRoomBtn" class="btn btn-primary">Add Room</button></header><div id="alertBox" class="alert hidden"></div><div class="card"><table class="data-table"><thead><tr><th>ID</th><th>Room No.</th><th>Type</th><th>Capacity</th><th>Occupants</th><th>Price</th><th>Actions</th></tr></thead><tbody id="roomsTableBody"><tr><td colspan="7" class="text-center">Loading...</td></tr></tbody></table></div></main></div>
<div id="roomModal" class="modal hidden"><div class="modal-content"><div class="modal-header"><h3 id="modalTitle">Add Room</h3><span id="closeModal" class="close-btn">&times;</span></div><form id="roomForm"><input id="roomId" type="hidden"><div class="form-group"><label>Room Number</label><input id="roomNumber" class="form-control" required></div><div class="form-group"><label>Room Type</label><select id="roomType" class="form-control" required><option value="AC">AC</option><option value="NON_AC">NON_AC</option></select></div><div class="form-group"><label>Capacity</label><input id="capacity" class="form-control" type="number" min="1" required></div><div class="form-group"><label>Price</label><input id="price" class="form-control" type="number" min="0" step="0.01" required></div><div class="form-actions"><button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div>
<script src="js/api.js"></script><script src="js/common.js"></script><script src="js/rooms.js"></script></body></html>
