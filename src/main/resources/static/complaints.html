<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Complaints | Hostel Management System</title><link rel="stylesheet" href="css/main.css"></head>
<body><div class="app-layout"><aside class="sidebar" id="sidebar"></aside><main class="main-content"><header class="top-header"><div><h2>Complaints</h2><p>Manage hostel complaints</p></div><button id="addComplaintBtn" class="btn btn-primary">New Complaint</button></header><div id="alertBox" class="alert hidden"></div><div class="card"><table class="data-table"><thead><tr><th>ID</th><th>Student</th><th>Title</th><th>Description</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="complaintsTableBody"><tr><td colspan="7" class="text-center">Loading...</td></tr></tbody></table></div></main></div>
<div id="complaintModal" class="modal hidden"><div class="modal-content"><div class="modal-header"><h3 id="modalTitle">New Complaint</h3><span id="closeModal" class="close-btn">&times;</span></div><form id="complaintForm"><input id="complaintId" type="hidden"><div id="complaintStudentGroup" class="form-group">
    <label for="complaintStudentId">Student ID</label>
    <input
            id="complaintStudentId"
            class="form-control"
            type="number"
            min="1"
            required>
</div>
    <div class="form-group"><label>Title</label><input id="complaintTitle" class="form-control" required></div><div class="form-group"><label>Description</label><textarea id="complaintDescription" class="form-control" rows="5" required></textarea></div><div id="complaintStatusGroup" class="form-group hidden"><label>Status</label><select id="complaintStatus" class="form-control"><option value="PENDING">PENDING</option><option value="IN_PROGRESS">IN_PROGRESS</option><option value="RESOLVED">RESOLVED</option></select></div><div class="form-actions"><button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div>
<script src="js/api.js"></script><script src="js/common.js"></script><script src="js/complaints.js"></script></body></html>
