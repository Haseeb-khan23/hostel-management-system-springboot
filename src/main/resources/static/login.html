<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hostel Management System</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <h2>Hostel Management System</h2>
        <p class="subtitle">Sign in to continue</p>
        <div id="alertBox" class="alert hidden"></div>
        <form id="loginForm">
            <div class="form-group"><label for="username">Username</label><input id="username" class="form-control" type="text" required autocomplete="username"></div>
            <div class="form-group"><label for="password">Password</label><input id="password" class="form-control" type="password" required autocomplete="current-password"></div>
            <button id="submitBtn" class="btn btn-primary btn-block" type="submit">Sign In</button>
        </form>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
