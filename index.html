<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Management System</title>
  <!-- Dashboard Summary Cards -->
  <div class="dashboard-cards">
    <div class="stat-card card-blue">
      <div class="card-icon">👥</div>
      <div class="card-info">
        <h3>Total Students</h3>
        <p id="totalStudentsCount">0</p>
      </div>
    </div>

    <div class="stat-card card-green">
      <div class="card-icon">🛏️</div>
      <div class="card-info">
        <h3>Total Rooms</h3>
        <p id="totalRoomsCount">0 <small style="font-size: 13px; font-weight: normal; color: #6b7280;">(<span id="availableBedsCount">0</span> Beds Left)</small></p>
      </div>
    </div>

    <div class="stat-card card-red">
      <div class="card-icon">⚠️</div>
      <div class="card-info">
        <h3>Pending Payments</h3>
        <p id="pendingPaymentsCount">0</p>
      </div>
    </div>
  </div>

  <style>
    /* 1. Global Reset & Base Layout */
    body {
        font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        margin: 0;
        padding: 24px;
        background-color: #f4f6f9;
        color: #333;
    }

    /* 2. Toast Container - Screen Top Center */
    #toast-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
    }

    .toast {
        min-width: 300px;
        max-width: 90vw;
        padding: 12px 20px;
        margin-bottom: 10px;
        border-radius: 8px;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        pointer-events: auto;
        animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .toast.success { background-color: #10b981; }
    .toast.error { background-color: #ef4444; }

    @keyframes slideDown {
        from { transform: translateY(-40px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* 3. Modern Dashboard Analytics Cards Grid */
    .dashboard-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: #ffffff;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        border: 1px solid #e5e7eb;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .stat-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .card-icon {
        font-size: 28px;
        margin-right: 16px;
        background: #f3f4f6;
        width: 54px;
        height: 54px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card-info h3 {
        margin: 0;
        font-size: 12px;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        font-weight: 600;
    }

    .card-info p {
        margin: 6px 0 0 0;
        font-size: 24px;
        font-weight: 700;
        color: #111827;
    }

    .card-blue { border-top: 4px solid #3b82f6; }
    .card-green { border-top: 4px solid #10b981; }
    .card-red { border-top: 4px solid #ef4444; }

    /* 4. Main Title & Navigation Tabs */
    h2 { margin-top: 0; margin-bottom: 20px; color: #111827; }

    .nav-tabs {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        border-bottom: 2px solid #e5e7eb;
        padding-bottom: 12px;
    }

    .tab-btn {
        padding: 10px 20px;
        font-weight: 600;
        background-color: #ffffff;
        color: #4b5563;
        border: 1px solid #e5e7eb;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.2s;
    }

    .tab-btn.active {
        background-color: #2563eb;
        color: white;
        border-color: #2563eb;
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
    }

    .tab-content { display: none; }
    .tab-content.active { display: flex; gap: 24px; flex-wrap: wrap; }

    /* 5. Forms & Tables Section Cards */
    .form-card {
        flex: 1;
        min-width: 320px;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        border: 1px solid #e5e7eb;
    }

    .table-card {
        flex: 2;
        min-width: 500px;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        border: 1px solid #e5e7eb;
    }

    /* 6. Form Fields & Buttons */
    form { display: flex; flex-direction: column; gap: 14px; }

    input, select, button {
        padding: 11px 14px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
        outline: none;
    }

    input:focus, select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    button {
        background-color: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.2s;
    }

    button:hover { background-color: #1d4ed8; }
    button.cancel-btn { background-color: #6b7280; display: none; }
    button.delete-btn { background-color: #ef4444; padding: 6px 12px; font-size: 12px; border-radius: 4px; }
    button.edit-btn { background-color: #f59e0b; color: white; padding: 6px 12px; font-size: 12px; margin-right: 6px; border-radius: 4px; }

    /* 7. Search Input & Table Styling */
    .search-box {
        margin-bottom: 16px;
        width: 100%;
        padding: 12px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid #d1d5db;
    }

    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 12px 14px; text-align: left; }
    th { background-color: #f9fafb; color: #374151; font-weight: 600; }
  </style>

</head>
<body>

<h2>🏠 Hostel Management System</h2>
<div id="alertBox" class="alert"></div>

<!-- Navigation Tabs -->
<div class="nav-tabs">
  <button class="tab-btn active" onclick="switchTab('studentsTab', this)">🎓 Students Management</button>
  <button class="tab-btn" onclick="switchTab('roomsTab', this)">🛏️ Rooms Management</button>
</div>

<!-- 1. STUDENTS TAB -->
<div id="studentsTab" class="tab-content active">
  <div class="card form-card">
    <h3 id="studentFormTitle">Add New Student</h3>
    <form id="studentForm">
      <input type="hidden" id="studentId">
      <input type="text" id="name" placeholder="Full Name *" required>
<!--      <input type="text" id="roomNumber" placeholder="Room Number *" required>-->
      <select id="roomNumberSelect" required>
        <option value="" disabled selected>Select a Room Number</option>
      </select>
      <input type="tel" id="mobileNo" placeholder="Mobile Number (10 digits) *" required pattern="[0-9]{10}">
      <input type="text" id="course" placeholder="Course *" required>
      <input type="text" id="address" placeholder="Address *" required>
      <select id="paymentStatus">
        <option value="Paid">Paid</option>
        <option value="Pending">Pending</option>
      </select>
      <button type="submit" id="studentSubmitBtn">Add Student</button>
      <button type="button" id="studentCancelBtn" class="cancel-btn" onclick="resetStudentForm()">Cancel Edit</button>
    </form>
  </div>

  <div class="card table-card">
    <h3>Student Directory</h3>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search by Name, Room No, or Course..." onkeyup="filterStudents()">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Room</th>
        <th>Mobile</th>
        <th>Course</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody id="studentTableBody"></tbody>
    </table>
  </div>
</div>

<!-- 2. ROOMS TAB -->
<div id="roomsTab" class="tab-content">
  <div class="card form-card">
    <h3 id="roomFormTitle">Add New Room</h3>
    <form id="roomForm">
      <input type="hidden" id="roomId">
      <input type="text" id="rRoomNumber" placeholder="Room Number (e.g., 101) *" required>
      <select id="rRoomType" required>
        <option value="" disabled selected>Select Room Type *</option>
        <option value="AC">AC</option>
        <option value="Non-AC">Non-AC</option>
      </select>
      <input type="number" id="rCapacity" placeholder="Capacity (e.g., 2) *" min="1" required>
      <input type="number" id="rPrice" placeholder="Price per Month (₹) *" step="0.01" required>
      <button type="submit" id="roomSubmitBtn">Add Room</button>
      <button type="button" id="roomCancelBtn" class="cancel-btn" onclick="resetRoomForm()">Cancel Edit</button>
    </form>
  </div>

  <div class="card table-card">
    <h3>Room Directory</h3>
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Room No</th>
        <th>Type</th>
        <th>Capacity</th>
        <th>Occupants</th>
        <th>Price (₹)</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody id="roomTableBody"></tbody>
    </table>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
